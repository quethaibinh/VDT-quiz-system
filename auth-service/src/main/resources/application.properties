server.port=8081

spring.application.name=auth-service
gateway.trusted-secret=${GATEWAY_TRUSTED_SECRET}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.jackson.serialization.indent_output=true
spring.web.error.include-message=always

# Database Configuration
spring.datasource.url=${DB_AUTH_URL}
spring.datasource.username=${DB_AUTH_USERNAME}
spring.datasource.password=${DB_AUTH_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
app.security.jwt.secret=${JWT_SECRET}
app.security.aes.key=${AES_KEY}
app.security.hmac.key=${HMAC_KEY}
app.security.internal-api-key=${INTERNAL_API_KEY:}
