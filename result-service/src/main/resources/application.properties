spring.application.name=result-service
server.port=8085

spring.datasource.url=${RESULT_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/result_service}
spring.datasource.username=${RESULT_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${RESULT_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${RESULT_SERVICE_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${RESULT_SERVICE_KAFKA_GROUP_ID:result-service}

gateway.trusted-secret=${GATEWAY_TRUSTED_SECRET}

result.kafka.enabled=${RESULT_KAFKA_ENABLED:true}
result.kafka.topic.runtime-submissions=${RESULT_RUNTIME_SUBMISSIONS_TOPIC:runtime-submission-events}
