result.kafka.enabled=false
result.kafka.topic.runtime-submissions=runtime-submission-events

spring.datasource.url=jdbc:h2:mem:result_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=result-service-test

gateway.trusted-secret=test-gateway-secret
services.internal-api-key=test-internal-key
services.auth.base-url=http://localhost:18081
services.exam.base-url=http://localhost:18083
services.question.base-url=http://localhost:18082
