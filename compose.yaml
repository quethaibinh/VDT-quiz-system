name: quiz-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_AUTH_NAME:-auth-service-db}
      POSTGRES_USER: ${DB_AUTH_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_AUTH_PASSWORD:?DB_AUTH_PASSWORD must be set}
    ports:
      - "${DB_AUTH_PORT:-5433}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  question-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_QUESTION_NAME:-question-service-db}
      POSTGRES_USER: ${DB_QUESTION_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_QUESTION_PASSWORD:?DB_QUESTION_PASSWORD must be set}
    ports:
      - "${DB_QUESTION_PORT:-5434}:5432"
    volumes:
      - question-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./auth-service
    restart: unless-stopped
    environment:
      DB_AUTH_URL: jdbc:postgresql://postgres:5432/${DB_AUTH_NAME:-auth-service-db}
      DB_AUTH_USERNAME: ${DB_AUTH_USERNAME:-postgres}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?DB_AUTH_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AES_KEY: ${AES_KEY:?AES_KEY must be set}
      HMAC_KEY: ${HMAC_KEY:?HMAC_KEY must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      GATEWAY_TRUSTED_SECRET: ${GATEWAY_TRUSTED_SECRET:?GATEWAY_TRUSTED_SECRET must be set}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8081'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  question-service:
    build:
      context: ./question-service
    restart: unless-stopped
    environment:
      DB_QUESTION_URL: jdbc:postgresql://question-postgres:5432/${DB_QUESTION_NAME:-question-service-db}
      DB_QUESTION_USERNAME: ${DB_QUESTION_USERNAME:-postgres}
      DB_QUESTION_PASSWORD: ${DB_QUESTION_PASSWORD:?DB_QUESTION_PASSWORD must be set}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      GATEWAY_TRUSTED_SECRET: ${GATEWAY_TRUSTED_SECRET:?GATEWAY_TRUSTED_SECRET must be set}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8082'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      question-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  exam-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_EXAM_NAME:-exam-service-db}
      POSTGRES_USER: ${DB_EXAM_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_EXAM_PASSWORD:-postgres}
    ports:
      - "${DB_EXAM_PORT:-5435}:5432"
    volumes:
      - exam-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  exam-service:
    build:
      context: ./exam-service
    restart: unless-stopped
    environment:
      DB_EXAM_URL: jdbc:postgresql://exam-postgres:5432/${DB_EXAM_NAME:-exam-service-db}
      DB_EXAM_USERNAME: ${DB_EXAM_USERNAME:-postgres}
      DB_EXAM_PASSWORD: ${DB_EXAM_PASSWORD:-postgres}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      QUESTION_SERVICE_URL: ${QUESTION_SERVICE_URL}
      EXAM_SERVICE_URL: ${EXAM_SERVICE_URL}
      EXAMRUNTIME_SERVICE_URL: ${EXAMRUNTIME_SERVICE_URL}
      RESULT_SERVICE_URL: ${RESULT_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8083'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      exam-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      question-service:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      QUESTION_SERVICE_URL: ${QUESTION_SERVICE_URL}
      EXAM_SERVICE_URL: ${EXAM_SERVICE_URL}
      EXAMRUNTIME_SERVICE_URL: ${EXAMRUNTIME_SERVICE_URL}
      RESULT_SERVICE_URL: ${RESULT_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GATEWAY_TRUSTED_SECRET: ${GATEWAY_TRUSTED_SECRET:?GATEWAY_TRUSTED_SECRET must be set}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8080'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      auth-service:
        condition: service_healthy
      question-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /
        VITE_ENABLE_MOCKS: "false"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  auth-postgres-data:
  question-postgres-data:
  exam-postgres-data:
