name: quiz-platform

x-examruntime-environment: &examruntime-environment
  DB_EXAMRUNTIME_URL: jdbc:postgresql://examruntime-postgres:5432/${DB_EXAMRUNTIME_NAME:-examruntime-service-db}
  DB_EXAMRUNTIME_USERNAME: ${DB_EXAMRUNTIME_USERNAME:-postgres}
  DB_EXAMRUNTIME_PASSWORD: ${DB_EXAMRUNTIME_PASSWORD:-postgres}
  AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
  QUESTION_SERVICE_URL: ${QUESTION_SERVICE_URL}
  EXAM_SERVICE_URL: ${EXAM_SERVICE_URL}
  RESULT_SERVICE_URL: ${RESULT_SERVICE_URL}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
  GATEWAY_TRUSTED_SECRET: ${GATEWAY_TRUSTED_SECRET:?GATEWAY_TRUSTED_SECRET must be set}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  EXAMRUNTIME_KAFKA_GROUP_ID: ${EXAMRUNTIME_KAFKA_GROUP_ID:-examruntime-service}
  EXAM_KAFKA_TOPIC_EXAM_LIFECYCLE: ${EXAM_KAFKA_TOPIC_EXAM_LIFECYCLE:-exam-lifecycle-events}
  EXAMRUNTIME_KAFKA_TOPIC_LIVE_QUIZ_RESULT: ${EXAMRUNTIME_KAFKA_TOPIC_LIVE_QUIZ_RESULT:-live-quiz-result-events}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_AUTH_NAME:-auth-service-db}
      POSTGRES_USER: ${DB_AUTH_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_AUTH_PASSWORD:?DB_AUTH_PASSWORD must be set}
    ports:
      - "${DB_AUTH_PORT:-5433}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  question-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_QUESTION_NAME:-question-service-db}
      POSTGRES_USER: ${DB_QUESTION_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_QUESTION_PASSWORD:?DB_QUESTION_PASSWORD must be set}
    ports:
      - "${DB_QUESTION_PORT:-5434}:5432"
    volumes:
      - question-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./auth-service
    restart: unless-stopped
    environment:
      DB_AUTH_URL: jdbc:postgresql://postgres:5432/${DB_AUTH_NAME:-auth-service-db}
      DB_AUTH_USERNAME: ${DB_AUTH_USERNAME:-postgres}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?DB_AUTH_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AES_KEY: ${AES_KEY:?AES_KEY must be set}
      HMAC_KEY: ${HMAC_KEY:?HMAC_KEY must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      GATEWAY_TRUSTED_SECRET: ${GATEWAY_TRUSTED_SECRET:?GATEWAY_TRUSTED_SECRET must be set}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8081'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  question-service:
    build:
      context: ./question-service
    restart: unless-stopped
    environment:
      DB_QUESTION_URL: jdbc:postgresql://question-postgres:5432/${DB_QUESTION_NAME:-question-service-db}
      DB_QUESTION_USERNAME: ${DB_QUESTION_USERNAME:-postgres}
      DB_QUESTION_PASSWORD: ${DB_QUESTION_PASSWORD:?DB_QUESTION_PASSWORD must be set}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      GATEWAY_TRUSTED_SECRET: ${GATEWAY_TRUSTED_SECRET:?GATEWAY_TRUSTED_SECRET must be set}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_QUESTION_MEDIA: ${MINIO_BUCKET_QUESTION_MEDIA:-quiz-question-media}
      QUESTION_MEDIA_MAX_BYTES: ${QUESTION_MEDIA_MAX_BYTES:-5242880}
      QUESTION_MEDIA_ALLOWED_TYPES: ${QUESTION_MEDIA_ALLOWED_TYPES:-image/png,image/jpeg,image/webp}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8082'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      question-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  exam-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_EXAM_NAME:-exam-service-db}
      POSTGRES_USER: ${DB_EXAM_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_EXAM_PASSWORD:-postgres}
    ports:
      - "${DB_EXAM_PORT:-5435}:5432"
    volumes:
      - exam-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  examruntime-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_EXAMRUNTIME_NAME:-examruntime-service-db}
      POSTGRES_USER: ${DB_EXAMRUNTIME_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_EXAMRUNTIME_PASSWORD:-postgres}
    ports:
      - "${DB_EXAMRUNTIME_PORT:-5436}:5432"
    volumes:
      - examruntime-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  result-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_RESULT_NAME:-result-service-db}
      POSTGRES_USER: ${DB_RESULT_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_RESULT_PASSWORD:-postgres}
    ports:
      - "${DB_RESULT_PORT:-5437}:5432"
    volumes:
      - result-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  exam-service:
    build:
      context: ./exam-service
    restart: unless-stopped
    environment:
      DB_EXAM_URL: jdbc:postgresql://exam-postgres:5432/${DB_EXAM_NAME:-exam-service-db}
      DB_EXAM_USERNAME: ${DB_EXAM_USERNAME:-postgres}
      DB_EXAM_PASSWORD: ${DB_EXAM_PASSWORD:-postgres}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      QUESTION_SERVICE_URL: ${QUESTION_SERVICE_URL}
      EXAM_SERVICE_URL: ${EXAM_SERVICE_URL}
      EXAMRUNTIME_SERVICE_URL: ${EXAMRUNTIME_SERVICE_URL}
      RESULT_SERVICE_URL: ${RESULT_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EXAM_KAFKA_TOPIC_EXAM_LIFECYCLE: ${EXAM_KAFKA_TOPIC_EXAM_LIFECYCLE:-exam-lifecycle-events}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8083'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      exam-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      question-service:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  examruntime-service:
    build:
      context: ./examruntime-service
    restart: unless-stopped
    environment:
      <<: *examruntime-environment
      EXAMRUNTIME_KAFKA_ENABLED: "false"
      EXAMRUNTIME_OUTBOX_ENABLED: "false"
      EXAMRUNTIME_RESULT_RECONCILIATION_ENABLED: "false"
      EXAMRUNTIME_AUTOSUBMIT_ENABLED: "false"
      EXAMRUNTIME_ANSWERS_CHECKPOINT_ENABLED: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8084'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      examruntime-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      exam-service:
        condition: service_healthy

  examruntime-worker:
    build:
      context: ./examruntime-service
    restart: unless-stopped
    environment:
      <<: *examruntime-environment
      EXAMRUNTIME_KAFKA_ENABLED: "true"
      EXAMRUNTIME_OUTBOX_ENABLED: "true"
      EXAMRUNTIME_RESULT_RECONCILIATION_ENABLED: "true"
      EXAMRUNTIME_AUTOSUBMIT_ENABLED: "true"
      EXAMRUNTIME_ANSWERS_CHECKPOINT_ENABLED: "true"
      EXAMRUNTIME_MONITOR_REDIS_PUBSUB_ENABLED: "false"
      EXAMRUNTIME_LIVEQUIZ_REDIS_PUBSUB_ENABLED: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8084'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      examruntime-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      exam-service:
        condition: service_healthy

  result-service:
    build:
      context: ./result-service
    restart: unless-stopped
    environment:
      RESULT_SERVICE_DATASOURCE_URL: jdbc:postgresql://result-postgres:5432/${DB_RESULT_NAME:-result-service-db}
      RESULT_SERVICE_DATASOURCE_USERNAME: ${DB_RESULT_USERNAME:-postgres}
      RESULT_SERVICE_DATASOURCE_PASSWORD: ${DB_RESULT_PASSWORD:-postgres}
      RESULT_SERVICE_JPA_DDL_AUTO: ${RESULT_SERVICE_JPA_DDL_AUTO:-update}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RESULT_SERVICE_KAFKA_GROUP_ID: ${RESULT_SERVICE_KAFKA_GROUP_ID:-result-service}
      RESULT_KAFKA_ENABLED: ${RESULT_KAFKA_ENABLED:-true}
      RESULT_RUNTIME_SUBMISSIONS_TOPIC: ${RESULT_RUNTIME_SUBMISSIONS_TOPIC:-runtime-submission-events}
      RESULT_LIVE_QUIZ_RESULTS_TOPIC: ${RESULT_LIVE_QUIZ_RESULTS_TOPIC:-live-quiz-result-events}
      GATEWAY_TRUSTED_SECRET: ${GATEWAY_TRUSTED_SECRET:?GATEWAY_TRUSTED_SECRET must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      EXAM_SERVICE_URL: ${EXAM_SERVICE_URL}
      QUESTION_SERVICE_URL: ${QUESTION_SERVICE_URL}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8085'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      result-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_QUESTION_MEDIA: ${MINIO_BUCKET_QUESTION_MEDIA:-quiz-question-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ACCESS_KEY}\" \"$${MINIO_SECRET_KEY}\" &&
      mc mb --ignore-existing local/\"$${MINIO_BUCKET_QUESTION_MEDIA}\"
      "
    depends_on:
      minio:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9094"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8086}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      QUESTION_SERVICE_URL: ${QUESTION_SERVICE_URL}
      EXAM_SERVICE_URL: ${EXAM_SERVICE_URL}
      EXAMRUNTIME_SERVICE_URL: ${EXAMRUNTIME_SERVICE_URL}
      RESULT_SERVICE_URL: ${RESULT_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GATEWAY_TRUSTED_SECRET: ${GATEWAY_TRUSTED_SECRET:?GATEWAY_TRUSTED_SECRET must be set}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/8080'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      auth-service:
        condition: service_healthy
      question-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
      examruntime-service:
        condition: service_healthy
      result-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /
        VITE_ENABLE_MOCKS: "false"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  auth-postgres-data:
  question-postgres-data:
  exam-postgres-data:
  examruntime-postgres-data:
  result-postgres-data:
  minio-data:
