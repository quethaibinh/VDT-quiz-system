spring.application.name=question-service
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.web.error.include-message=always

spring.datasource.url=${DB_QUESTION_URL}
spring.datasource.username=${DB_QUESTION_USERNAME}
spring.datasource.password=${DB_QUESTION_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

internal.api-key=${INTERNAL_API_KEY}
services.auth.base-url=${AUTH_SERVICE_URL}
services.internal-api-key=${INTERNAL_API_KEY}
gateway.trusted-secret=${GATEWAY_TRUSTED_SECRET}

question.media.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
question.media.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
question.media.access-key=${MINIO_ACCESS_KEY:minioadmin}
question.media.secret-key=${MINIO_SECRET_KEY:minioadmin}
question.media.bucket=${MINIO_BUCKET_QUESTION_MEDIA:quiz-question-media}
question.media.max-bytes=${QUESTION_MEDIA_MAX_BYTES:5242880}
question.media.allowed-types=${QUESTION_MEDIA_ALLOWED_TYPES:image/png,image/jpeg,image/webp}
question.media.signed-url-ttl-seconds=${QUESTION_MEDIA_SIGNED_URL_TTL_SECONDS:900}
