spring.datasource.url=jdbc:h2:mem:examruntime-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
services.auth.base-url=http://localhost:18081
services.question.base-url=http://localhost:18082
services.exam.base-url=http://localhost:18083
services.internal-api-key=test-internal-api-key
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.consumer.group-id=examruntime-service-test
examruntime.kafka.topic.exam-lifecycle=exam-lifecycle-events-test
examruntime.kafka.enabled=false
