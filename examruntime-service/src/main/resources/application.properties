spring.application.name=examruntime-service
server.port=8084
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.web.error.include-message=always

spring.datasource.url=${DB_EXAMRUNTIME_URL}
spring.datasource.username=${DB_EXAMRUNTIME_USERNAME}
spring.datasource.password=${DB_EXAMRUNTIME_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

services.auth.base-url=${AUTH_SERVICE_URL}
services.question.base-url=${QUESTION_SERVICE_URL}
services.exam.base-url=${EXAM_SERVICE_URL}
services.internal-api-key=${INTERNAL_API_KEY}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=${EXAMRUNTIME_KAFKA_GROUP_ID:examruntime-service}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

examruntime.kafka.enabled=${EXAMRUNTIME_KAFKA_ENABLED:true}
examruntime.kafka.topic.exam-lifecycle=${EXAM_KAFKA_TOPIC_EXAM_LIFECYCLE:exam-lifecycle-events}
examruntime.kafka.topic.submission=${EXAMRUNTIME_KAFKA_TOPIC_SUBMISSION:runtime-submission-events}
examruntime.kafka.topic.auto-create=${EXAMRUNTIME_KAFKA_TOPIC_AUTO_CREATE:true}
examruntime.kafka.topic.submission.partitions=${EXAMRUNTIME_KAFKA_TOPIC_SUBMISSION_PARTITIONS:3}
examruntime.kafka.topic.submission.replication-factor=${EXAMRUNTIME_KAFKA_TOPIC_SUBMISSION_REPLICATION_FACTOR:1}
examruntime.kafka.publish-timeout-ms=${EXAMRUNTIME_KAFKA_PUBLISH_TIMEOUT_MS:5000}
examruntime.outbox.enabled=${EXAMRUNTIME_OUTBOX_ENABLED:true}
examruntime.outbox.batch-size=${EXAMRUNTIME_OUTBOX_BATCH_SIZE:20}
examruntime.outbox.poll-delay-ms=${EXAMRUNTIME_OUTBOX_POLL_DELAY_MS:5000}
examruntime.autosubmit.enabled=${EXAMRUNTIME_AUTOSUBMIT_ENABLED:true}
examruntime.autosubmit.batch-size=${EXAMRUNTIME_AUTOSUBMIT_BATCH_SIZE:50}
examruntime.autosubmit.poll-delay-ms=${EXAMRUNTIME_AUTOSUBMIT_POLL_DELAY_MS:10000}
