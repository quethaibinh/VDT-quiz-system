name: Reusable Java CI Template

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "The directory containing the Java Maven project"
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Disable shallow clones for better SonarCloud analysis relevancy

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: ${{ inputs.working-directory }}
        run: chmod +x mvnw

      - name: Build and Test with Maven
        working-directory: ${{ inputs.working-directory }}
        run: ./mvnw verify

      - name: Build Docker Image
        working-directory: ${{ inputs.working-directory }}
        run: docker build -t ${{ inputs.working-directory }}-test .
