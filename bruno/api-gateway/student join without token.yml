info:
  name: student join without token
  type: http
  seq: 34

http:
  method: POST
  url: "{{url}}/v1/api/examruntime-service/student/exams/{{examId}}/join"
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const status = res.status ?? body?.status;

        if (status !== 401) {
          throw new Error(`Expected 401 for student route without token, got: ${status || JSON.stringify(body)}`);
        }
        console.log("Student join without token was rejected as expected.");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
