info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/v1/api/auth-service/login"
  body:
    type: json
    data: |-
      {
        "username": "thanh1",
        "password": "123456"
      }
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.data || res.getBody();
        console.log("hello");
        console.log(token);
        if (token) {
          bru.setEnvVar("token", token);
          console.log("JWT Token đã được cập nhật tự động!");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
