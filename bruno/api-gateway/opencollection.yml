opencollection: 1.0.0

info:
  name: api-gateway
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: after-response
      code: |-
        const token = bru.getEnvVar("token");

        if (token) {
          req.setHeader("Authorization", `Bearer ${token}`);
        }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
