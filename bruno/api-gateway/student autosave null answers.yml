info:
  name: student autosave null answers
  type: http
  seq: 31

http:
  method: PUT
  url: "{{url}}/v1/api/examruntime-service/student/sessions/{{sessionId}}/answers"
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "clientSeq": {{clientSeq}},
        "answers": null
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = body?.data ?? body;

        if (!data?.sessionId) {
          throw new Error("Autosave null answers response must contain data.sessionId.");
        }
        if (data.sessionId !== bru.getEnvVar("sessionId")) {
          throw new Error(`Autosave null answers sessionId mismatch. Expected ${bru.getEnvVar("sessionId")}, got ${data.sessionId}`);
        }
        if (Number(data.savedCount) !== 0) {
          throw new Error(`Null answers should not save rows. savedCount=${data.savedCount}`);
        }

        const nextSeq = Number(bru.getEnvVar("clientSeq") || 1) + 1;
        bru.setEnvVar("clientSeq", String(nextSeq));
        console.log(`Null answers accepted. Next clientSeq=${nextSeq}`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
