spring.datasource.url=jdbc:h2:mem:exam-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
services.auth.base-url=http://localhost:18081
services.question.base-url=http://localhost:18082
services.examruntime.base-url=http://localhost:18084
services.internal-api-key=test-internal-api-key
spring.data.redis.host=localhost
spring.data.redis.port=6379
exam.outbox.enabled=false
exam.activation.enabled=false
exam.kafka.topic.auto-create=false
