spring.application.name=exam-service
server.port=8083
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.web.error.include-message=always

spring.datasource.url=${DB_EXAM_URL}
spring.datasource.username=${DB_EXAM_USERNAME}
spring.datasource.password=${DB_EXAM_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

services.auth.base-url=${AUTH_SERVICE_URL}
services.question.base-url=${QUESTION_SERVICE_URL}
services.internal-api-key=${INTERNAL_API_KEY:local-internal-key}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.admin.fail-fast=false

# Outbox worker day snapshot sang Redis va event activation sang Kafka sau khi transaction da commit.
exam.outbox.poll-delay-ms=${EXAM_OUTBOX_POLL_DELAY_MS:5000}
exam.outbox.batch-size=${EXAM_OUTBOX_BATCH_SIZE:20}

# Cau hinh publish event Kafka.
exam.kafka.topic.auto-create=${EXAM_KAFKA_TOPIC_AUTO_CREATE:true}
exam.kafka.topic.exam-lifecycle=${EXAM_KAFKA_TOPIC_EXAM_LIFECYCLE:exam-lifecycle-events}
exam.kafka.topic.exam-lifecycle.partitions=${EXAM_KAFKA_TOPIC_EXAM_LIFECYCLE_PARTITIONS:3}
exam.kafka.topic.exam-lifecycle.replication-factor=${EXAM_KAFKA_TOPIC_EXAM_LIFECYCLE_REPLICATION_FACTOR:1}
exam.kafka.publish-timeout-ms=${EXAM_KAFKA_PUBLISH_TIMEOUT_MS:5000}

# Scheduler kich hoat ca thi.
exam.activation.enabled=${EXAM_ACTIVATION_ENABLED:true}
exam.activation.poll-delay-ms=${EXAM_ACTIVATION_POLL_DELAY_MS:60000}
exam.activation.batch-size=${EXAM_ACTIVATION_BATCH_SIZE:100}
exam.activation.preload-lead-minutes=${EXAM_ACTIVATION_PRELOAD_LEAD_MINUTES:30}
