spring.application.name=exam-service
server.port=8083
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.web.error.include-message=always

spring.datasource.url=${DB_EXAM_URL}
spring.datasource.username=${DB_EXAM_USERNAME}
spring.datasource.password=${DB_EXAM_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

services.auth.base-url=${AUTH_SERVICE_URL}
services.question.base-url=${QUESTION_SERVICE_URL}
services.internal-api-key=${INTERNAL_API_KEY:local-internal-key}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Outbox worker day snapshot sang Redis sau khi transaction schedule da commit.
exam.outbox.poll-delay-ms=${EXAM_OUTBOX_POLL_DELAY_MS:5000}
exam.outbox.batch-size=${EXAM_OUTBOX_BATCH_SIZE:20}
